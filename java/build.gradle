plugins {
    id 'application'
    id 'java'
}

group = 'ru.ithub'
version = '1.0'

repositories { mavenCentral() }

dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }

test { useJUnitPlatform(); testLogging { events 'passed', 'skipped', 'failed' } }

application { mainClass = 'ru.ithub.chess.Main' }

run {
    if (project.hasProperty('appArgs')) {
        args project.property('appArgs').toString().split(' ')
    }
}
